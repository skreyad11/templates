<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Features</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0a;font-family:'Courier New',monospace;color:#00ff41}
        .sidebar{position:fixed;left:0;top:0;width:220px;height:100%;background:#111;border-right:1px solid #222;padding:20px;overflow-y:auto}
        .logo{font-size:22px;font-weight:bold;padding:15px 0 20px;border-bottom:1px solid #222;margin-bottom:20px}
        .sidebar a{display:block;padding:12px 16px;color:#666;text-decoration:none;border-radius:6px;margin-bottom:4px;transition:0.3s;font-size:14px}
        .sidebar a:hover,.sidebar a.active{color:#00ff41;background:#1a1a1a}
        .sidebar a.logout{color:#ff0040;margin-top:30px;border-top:1px solid #222;padding-top:20px}
        .main{margin-left:220px;padding:30px}
        .feature-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:20px}
        .feature-card{background:#111;padding:20px;border-radius:8px;border:1px solid #222;transition:0.3s}
        .feature-card:hover{border-color:#00ff41}
        .feature-card .name{font-size:16px;font-weight:bold}
        .feature-card .desc{color:#666;font-size:13px;margin-top:5px}
        .feature-card .status{color:#00ff41;font-size:12px;margin-top:10px}
        .badge{background:#00ff41;color:#0a0a0a;padding:2px 10px;border-radius:12px;font-size:10px;font-weight:bold}
        .badge-off{background:#222;color:#666;padding:2px 10px;border-radius:12px;font-size:10px;font-weight:bold}
    </style>
</head>
<body>
<div class="sidebar">
    <div class="logo">⚡ FF ADMIN</div>
    <a href="/admin/dashboard">📊 Dashboard</a>
    <a href="/admin/keys">🔑 Keys</a>
    <a href="/admin/users">👥 Users</a>
    <a href="/admin/logs">📝 Logs</a>
    <a href="/admin/features" class="active">⚙️ Features</a>
    <a href="/admin/settings">🔧 Settings</a>
    <a href="/admin/logout" class="logout">🚪 Logout</a>
</div>
<div class="main">
    <h1>⚙️ Feature Management</h1>
    <p style="color:#666;margin:10px 0">All features are enabled by default for new licenses</p>
    <div class="feature-grid">
        {% for f in features %}
        <div class="feature-card">
            <div class="name">{{ f.label }}</div>
            <div class="desc">{{ f.desc }}</div>
            <div class="status"><span class="badge">✅ Enabled</span></div>
        </div>
        {% endfor %}
    </div>
</div>
</body>
</html>
