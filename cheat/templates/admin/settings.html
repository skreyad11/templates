<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0a;font-family:'Courier New',monospace;color:#00ff41}
        .sidebar{position:fixed;left:0;top:0;width:220px;height:100%;background:#111;border-right:1px solid #222;padding:20px;overflow-y:auto}
        .logo{font-size:22px;font-weight:bold;padding:15px 0 20px;border-bottom:1px solid #222;margin-bottom:20px}
        .sidebar a{display:block;padding:12px 16px;color:#666;text-decoration:none;border-radius:6px;margin-bottom:4px;transition:0.3s;font-size:14px}
        .sidebar a:hover,.sidebar a.active{color:#00ff41;background:#1a1a1a}
        .sidebar a.logout{color:#ff0040;margin-top:30px;border-top:1px solid #222;padding-top:20px}
        .main{margin-left:220px;padding:30px}
        .setting-item{background:#111;padding:20px;border-radius:8px;border:1px solid #222;margin:10px 0;display:flex;justify-content:space-between;align-items:center}
        .setting-item .label{font-size:14px}
        .setting-item .value{color:#666;font-size:13px}
    </style>
</head>
<body>
<div class="sidebar">
    <div class="logo">⚡ FF ADMIN</div>
    <a href="/admin/dashboard">📊 Dashboard</a>
    <a href="/admin/keys">🔑 Keys</a>
    <a href="/admin/users">👥 Users</a>
    <a href="/admin/logs">📝 Logs</a>
    <a href="/admin/features">⚙️ Features</a>
    <a href="/admin/settings" class="active">🔧 Settings</a>
    <a href="/admin/logout" class="logout">🚪 Logout</a>
</div>
<div class="main">
    <h1>🔧 System Settings</h1>
    {% for key, value in settings.items() %}
    <div class="setting-item">
        <div class="label">{{ key|replace('_',' ')|title }}</div>
        <div class="value">{{ value }}</div>
    </div>
    {% endfor %}
    <div style="margin-top:30px;color:#666;font-size:13px;text-align:center;border-top:1px solid #222;padding-top:20px">
        FF Proxy v2.0 • OB54 • Running on Railway
    </div>
</div>
</body>
</html>
